{% extends "base.html" %}

{% block content %}
<div class="max-w-lg mx-auto">
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">

    <div class="px-6 py-5 border-b border-slate-200">
      <h1 class="text-2xl font-semibold text-slate-900">
        Change Password
      </h1>
      <p class="text-sm text-slate-500 mt-1">
        Update the password for @{{ user.handle }}.
      </p>
    </div>

    <div class="p-6">
      {% if error %}
        <div class="mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-sm text-red-700">
          {{ error }}
        </div>
      {% endif %}

      {% if success %}
        <div class="mb-4 p-3 rounded-lg bg-emerald-50 border border-emerald-200 text-sm text-emerald-700">
          {{ success }}
        </div>
      {% endif %}

      <form method="post" action="/change-password" class="space-y-5">

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">
            Current password
          </label>
          <input
            type="password"
            name="current_password"
            required
            autocomplete="current-password"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">
            New password
          </label>
          <input
            type="password"
            name="new_password"
            required
            minlength="8"
            autocomplete="new-password"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
          <p class="text-xs text-slate-500 mt-1">
            At least 8 characters.
          </p>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">
            Confirm new password
          </label>
          <input
            type="password"
            name="confirm_password"
            required
            minlength="8"
            autocomplete="new-password"
            class="w-full border border-slate-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          >
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <a
            href="/dashboard"
            class="px-4 py-2 border border-slate-300 rounded-lg text-slate-700 hover:bg-slate-50"
          >
            Cancel
          </a>

          <button
            type="submit"
            class="px-4 py-2 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700"
          >
            Change Password
          </button>
        </div>

      </form>
    </div>

  </div>
</div>
{% endblock %}
